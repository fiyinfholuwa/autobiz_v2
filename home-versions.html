<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homepage versions · AutoBiz</title>
  <meta name="theme-color" content="#191919">
  <link rel="icon" href="./assets/img/logo.svg" type="image/svg+xml">
  <script>try{document.documentElement.setAttribute("data-bs-theme",(JSON.parse(localStorage.getItem("autobiz_v2"))||{}).settings?.theme||"light")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="./assets/css/app.css" rel="stylesheet">
  <script src="./assets/js/brand.js"></script>
  <style>
    .gv-top { background: var(--ab-sidebar); color: #fff; }
    .gv-top .inner { max-width: 1400px; margin: 0 auto; padding: .9rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .gv-brand { display: flex; align-items: center; gap: .6rem; color: #fff; font-weight: 800; }
    .gv-brand img { width: 30px; height: 30px; }
    .gv-wrap { max-width: 1400px; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }
    @media (max-width: 575.98px) { .gv-wrap { padding: 1rem .85rem 2rem; } .gv-top .inner { padding: .8rem .85rem; } }

    .gv-card { background: var(--ab-surface); border: 1px solid var(--ab-border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: box-shadow .2s, transform .2s; }
    .gv-card:hover { box-shadow: var(--ab-shadow); transform: translateY(-2px); }
    .gv-shot { position: relative; background: var(--ab-surface-2); overflow: hidden; border-bottom: 1px solid var(--ab-border); }
    /* Live preview: the page is rendered at real size inside an iframe, then scaled down */
    .gv-shot iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
    .gv-shot .open-cover { position: absolute; inset: 0; z-index: 2; }
    .gv-shot .badge-v { position: absolute; top: 10px; left: 10px; z-index: 3; background: var(--ab-sidebar); color: #fff; font-weight: 800; font-size: .72rem; padding: .25rem .55rem; border-radius: 8px; }
    .gv-shot .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ab-muted); font-size: .8rem; }
    .gv-body { padding: 1rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .4rem; flex: 1; }
    .gv-body h3 { font-size: 1rem; margin: 0; }
    .gv-body p { font-size: .82rem; color: var(--ab-muted); margin: 0; }
    .gv-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .2rem; }
    .gv-tags span { font-size: .68rem; font-weight: 600; padding: .15rem .5rem; border-radius: 999px; background: var(--ab-surface-2); color: var(--ab-muted); border: 1px solid var(--ab-border); }
    .gv-actions { display: flex; gap: .5rem; margin-top: auto; padding-top: .6rem; }
    .missing { display: grid; place-items: center; height: 100%; text-align: center; color: var(--ab-muted); font-size: .82rem; padding: 1rem; }
  </style>
</head>
<body>
  <header class="gv-top">
    <div class="inner">
      <a href="./index.html" class="gv-brand"><img src="./assets/img/logo.svg" alt="">AutoBiz · Homepage versions</a>
      <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
        <div class="ab-segment" id="device" role="group" aria-label="Preview size">
          <button class="active" data-w="1440"><i class="bi bi-display me-1"></i>Desktop</button>
          <button data-w="390"><i class="bi bi-phone me-1"></i>Phone</button>
        </div>
        <a href="./admin/theme.html#homepage" class="btn btn-sm btn-light fw-semibold"><i class="bi bi-sliders me-1"></i>Choose homepage &amp; colours</a>
      </div>
    </div>
  </header>

  <main class="gv-wrap">
    <div class="ab-page-head">
      <div><h1>Homepage versions</h1><p>Ten homepage designs plus the classic one. The admin chooses which is live in Brand &amp; theme. Previews are live pages — open any to click through.</p></div>
    </div>
    <div class="row g-3 g-lg-4" id="grid"></div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/data.js"></script>
<script src="./assets/js/app.js"></script>
<script>
(function () {
  const urlOf = (f) => "./" + f + (f === "index.html" ? "?classic=1" : "");
  const live = ABBrand.get().home;
  const VERSIONS = [
    { file: "index.html", tag: "Classic", name: "Classic homepage", desc: "Shop-first homepage with quick-service widget, deals, travel, gift card rates and USD card band.", tags: ["Shared header", "Balanced"] },
    { file: "index1.html", tag: "1", name: "Marketplace-first megastore", desc: "Category menu beside a big promo carousel, flash sale with stock bars, tabbed deals by category.", tags: ["Shared header", "Retail", "Dense"] },
    { file: "index2.html", tag: "2", name: "Super-app launcher", desc: "App-like: big search with quick intents and a grid of live service tiles.", tags: ["Custom header", "Mobile-first", "Friendly"] },
    { file: "index3.html", tag: "3", name: "Editorial magazine", desc: "Oversized typography and numbered chapters for each service, magazine-cover hero.", tags: ["Custom header", "Typographic", "Premium"] },
    { file: "index4.html", tag: "4", name: "Travel-led booking engine", desc: "Full-bleed hero with a tabbed booking widget; destinations, routes and travel essentials.", tags: ["Custom header", "Travel", "Booking"] },
    { file: "index5.html", tag: "5", name: "Dark premium", desc: "Always-dark luxury look with glass cards, a glowing USD card and a live rate board.", tags: ["Custom header", "Dark", "Fintech"] },
    { file: "index6.html", tag: "6", name: "Bento grid", desc: "The hero is a bento of live mini-widgets: eSIM, flights, gift card calculator, airtime, deals.", tags: ["Shared header", "Bento", "Interactive"] },
    { file: "index7.html", tag: "7", name: "Split-screen fintech", desc: "Phone mockup hero and a sticky scroll story walking through every service.", tags: ["Custom header", "Story", "Trust"] },
    { file: "index8.html", tag: "8", name: "Black Friday campaign", desc: "Countdown hero, deal ticker, coupon cards and price-band shelves.", tags: ["Shared header", "Campaign", "Bold"] },
    { file: "index9.html", tag: "9", name: "Search-first", desc: "A calm page with one smart command bar that understands products, trips, eSIMs, gift cards and bills.", tags: ["Custom header", "Minimal", "Search"] },
    { file: "index10.html", tag: "10", name: "Local & community", desc: "Nigeria-rooted storytelling with delivery coverage by state, local products and reseller CTA.", tags: ["Shared header", "Warm", "Local"] }
  ];
  const grid = document.getElementById("grid");
  let W = 1440;

  function shotHeight() { return W === 1440 ? 0.62 : 1.75; } // preview box height relative to its width

  function render() {
    grid.innerHTML = VERSIONS.map((v, i) => `
      <div class="${W === 1440 ? "col-md-6 col-xl-4" : "col-6 col-md-4 col-xl-3"}">
        <article class="gv-card">
          <div class="gv-shot" data-i="${i}" style="aspect-ratio: 1 / ${shotHeight()}">
            <span class="badge-v">${v.tag}</span>${v.file === live ? '<span class="badge-v" style="left:auto;right:10px;background:var(--ab-accent)">● Live</span>' : ""}
            <div class="loading" data-loading><span class="spinner-border spinner-border-sm me-2"></span>Loading preview…</div>
            <a href="${urlOf(v.file)}" class="open-cover" target="_blank" rel="noopener" aria-label="Open ${AB.esc(v.name)}"></a>
          </div>
          <div class="gv-body">
            <h3>${AB.esc(v.name)}</h3>
            <p>${AB.esc(v.desc)}</p>
            <div class="gv-tags">${v.tags.map((t) => `<span>${AB.esc(t)}</span>`).join("")}</div>
            <div class="gv-actions">
              <a href="${urlOf(v.file)}" class="btn btn-primary btn-sm flex-fill" target="_blank" rel="noopener">Open <i class="bi bi-box-arrow-up-right ms-1"></i></a>
              <button class="btn btn-light-subtle btn-sm" data-copy="${v.file}" aria-label="Copy file name">${v.file}</button>
            </div>
          </div>
        </article>
      </div>`).join("");
    grid.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => AB.copy(b.dataset.copy, b.dataset.copy + " copied")));
    // Lazily load each live preview when it scrolls into view
    const io = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) { load(e.target); io.unobserve(e.target); } }), { rootMargin: "200px" });
    grid.querySelectorAll(".gv-shot").forEach((el) => io.observe(el));
  }

  async function load(box) {
    const v = VERSIONS[+box.dataset.i];
    // Show a friendly placeholder if a version file doesn't exist yet
    try { const r = await fetch(urlOf(v.file), { method: "HEAD" }); if (!r.ok) throw 0; }
    catch (e) { box.querySelector("[data-loading]").outerHTML = `<div class="missing"><div><i class="bi bi-hourglass-split d-block fs-4 mb-1"></i>${AB.esc(v.file)} isn't built yet</div></div>`; return; }
    const f = document.createElement("iframe");
    f.title = v.name + " preview"; f.loading = "lazy"; f.tabIndex = -1; f.setAttribute("aria-hidden", "true");
    f.width = W; f.height = Math.round(W * shotHeight());
    f.src = urlOf(v.file);
    f.addEventListener("load", () => { const l = box.querySelector("[data-loading]"); l && l.remove(); });
    box.insertBefore(f, box.querySelector(".open-cover"));
    scale(box);
  }
  function scale(box) {
    const f = box.querySelector("iframe"); if (!f) return;
    f.style.transform = `scale(${box.clientWidth / W})`;
  }
  window.addEventListener("resize", AB.debounce(() => grid.querySelectorAll(".gv-shot").forEach(scale), 120));

  document.querySelectorAll("#device button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#device button").forEach((x) => x.classList.toggle("active", x === b));
    W = +b.dataset.w; render();
  }));
  render();
})();
</script>
</body>
</html>
